      var i = parseInt(b.dataset.i, 10);
      gs.history.push(gs.node);
      gs.node = node.o[i][1];
      render();
    };
  });
  var back = $('akBack');
  if (back) back.onclick = function(){ gs.node = gs.history.pop(); render(); };

function renderWishes(){

  if (!wishes.length){
    list.innerHTML = '<div class="empty-wishes">Пока ничего не сохранено.<br>Пройди акинатор — и сохрани, что захочется 🤍</div>';
    return;
  }
  list.innerHTML = wishes.map(function(w, i){
    var vanya = w.vanya ? '<div class="saved-vanya">📋 Ване: ' + w.vanya + '</div>' : '';

      '<button class="saved-del" data-idx="' + i + '" type="button">✕</button>' +

      vanya +

      saveWishes(list);
      renderWishes();
      showToast('🗑 Удалено');
    };
  });

function showFinale(finaleStr){
  var parts = finaleStr.split('|');
  var title = (parts[0]||'').trim();
  var vanya = (parts[1]||'').trim();
  var nastya = (parts[2]||'').trim();
  var vanyaEmpty = !vanya || vanya === '—' || vanya === '-';
  var h = '<div class="q-count">✨ Кажется, ты хочешь</div>';
  h += '<div class="final-title">🎁 ' + title + '</div>';
  h += '<div class="blk blk-vanya"><div class="blk-lbl">📋 Ване</div><div class="blk-txt' + (vanyaEmpty?' empty':'') + '">' + (vanyaEmpty?'ничего покупать не нужно':vanya) + '</div></div>';
  h += '<div class="blk blk-nastya"><div class="blk-lbl">💗 Насте</div><div class="blk-txt">' + nastya + '</div></div>';
  h += '<button class="act-btn act-gold" id="akSend" type="button">❤️ Отправить Насте</button>';
  h += '<button class="act-btn act-secondary" id="akReject" type="button">Не то — покажи ещё</button>';
  $('akBody').innerHTML = h;
  $('akSend').onclick = function(){
    sendToNastya(title, vanyaEmpty ? '' : vanya, nastya);
    var list = getWishes();
    list.unshift({ id: Date.now(), title: title, vanya: vanyaEmpty ? '' : vanya, nastya: nastya, createdAt: Date.now() });
    saveWishes(list);
    showToast('❤️ Отправлено Насте!');
    renderWishes();
  };
  $('akReject').onclick = function(){
    var other = pickRandomFinale(finaleStr);
    showFinale(other);
  };
}

function pickRandomFinale(exclude){
  var all = [];
  for (var k in T){
    var v = T[k];
    if (typeof v === 'string' && v.indexOf('|') !== -1){
      var p = v.split('|');
      if (p.length >= 3 && p[2].trim().length > 5) all.push(v);
    }
  }
  if (all.length < 2) return exclude;
  var pick = exclude;
  while (pick === exclude) pick = all[Math.floor(Math.random()*all.length)];
  return pick;
}

function sendToNastya(title, vanya, nastya){
  var note = {
    id: Date.now(),
    type: 'akinator',
    title: title,
    cost: 0,
    tier: 'akinator',
    dateKey: null,
    fromVanya: true,
    vanya: vanya || '',
    nastya: nastya,
    seen: false,
    createdAt: Date.now()
  };
  if (mainDocRef){
    mainDocRef.get().then(function(doc){
      var data = doc.exists ? doc.data() : {};
      var arr = data.notificationsForNastya || [];
      arr.unshift(note);
      if (arr.length > 200) arr = arr.slice(0, 200);
      return mainDocRef.set({ notificationsForNastya: arr }, { merge: true });
    }).catch(function(e){ console.warn('fb saveclick failed:', e); });
  }
}
