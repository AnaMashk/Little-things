<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3A3028">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little things">
<title>Наши маленькие вещи ❤️</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon180.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Marck+Script&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
audio,video{display:none!important}
:root{--cream:#F5EFE0;--cream2:#FAF6EC;--dark:#2E2419;--brown:#5A4A3A;--muted:#8A7A66;--line:#D4C4A8;--gold:#C9A961;--gold-deep:#A8842E;--blue:#B8D0DC;--blue-deep:#8FA9BA;--purple:#D5C4DB;--purple-deep:#B09CBC;--rose:#E8B8BD;--rose-deep:#D4989E;--green:#B5C4A8;--red:#C97A7A;--shadow:0 8px 30px rgba(60,40,20,.18);--shadow-soft:0 3px 14px rgba(60,40,20,.12)}
html{min-height:100%;background:url('https://i.ibb.co/4Rr0h6XY/IMG-4341.jpg') center center / cover no-repeat;background-color:#3A3028;overscroll-behavior:none}
body{font-family:'Montserrat',sans-serif;color:var(--dark);min-height:100vh;line-height:1.5;overflow-x:hidden;padding:12px 12px 24px;background:transparent;position:relative;overscroll-behavior:none}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(40,30,20,.35) 0%,rgba(40,30,20,.10) 40%,rgba(40,30,20,.35) 100%)}
.app{width:100%;max-width:520px;min-height:0;position:relative;padding-bottom:24px;z-index:2;margin:0 auto;background:transparent}
.header{text-align:center;padding:20px 16px 12px;position:relative;z-index:2}
.header-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:500;letter-spacing:4px;text-transform:uppercase;line-height:1.1;color:#F5EBD5;text-shadow:0 2px 12px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4)}
.header-title::after{content:'♡';display:block;font-size:16px;margin-top:14px;color:#F5EBD5;opacity:.85;line-height:1}
.header-names{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:500;letter-spacing:4px;text-transform:uppercase;margin-top:10px;display:inline-block;padding:10px 26px;border:1px solid rgba(255,255,255,.55);border-radius:2px;color:#F5EBD5;background:rgba(245,235,213,.08);backdrop-filter:blur(2px)}
.header-subtitle{margin-top:14px;font-size:10px;color:#EBDFC5;letter-spacing:3px;text-transform:uppercase;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.55);line-height:1.6}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,rgba(250,246,236,.96),rgba(240,232,214,.94));border:1px solid rgba(201,169,97,.35);border-radius:18px;margin:14px 4px 0;padding:6px 4px;position:relative;z-index:4;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
.nav-item{padding:12px 2px 10px;background:none;color:var(--brown);font-size:9px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;border-bottom:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:inherit;border:none;border-radius:12px;transition:all .2s;opacity:.7}
.nav-item .nav-icon{font-size:18px;transition:transform .3s;color:var(--brown)}
.nav-item.active{color:var(--dark);background:rgba(201,169,97,.12);opacity:1}
.nav-item.active .nav-icon{transform:scale(1.1);color:var(--gold-deep)}
.nav-item:active .nav-icon{transform:scale(.9)}
.page{display:none;padding:20px 8px;animation:fadeIn .45s cubic-bezier(.34,1.2,.64,1);position:relative;z-index:2}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;text-align:center;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;display:inline-block;width:100%;color:#F5EBD5;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.section-sub{color:#EBDFC5;font-weight:400;font-size:11px;letter-spacing:1.5px;background:rgba(245,235,213,.1);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:10px 18px;display:block;width:100%;box-sizing:border-box;margin:10px 0 18px;text-align:center;backdrop-filter:blur(2px);text-shadow:0 1px 4px rgba(0,0,0,.4)}
.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:linear-gradient(180deg,rgba(250,246,236,.96),rgba(240,232,214,.94));border-radius:20px;padding:14px 10px;border:1px solid rgba(201,169,97,.4);box-shadow:var(--shadow);position:relative;overflow:hidden}
.month-arrow{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.5);color:var(--brown);font-size:22px;border:1px solid rgba(201,169,97,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;position:relative;z-index:2;transition:background .2s}
.month-arrow:active{background:rgba(201,169,97,.25);transform:scale(.92)}
.month-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:32px;line-height:1;color:#2E2419;letter-spacing:1px}
.month-year{font-family:'Cormorant Garamond',serif;color:var(--brown);font-size:15px;font-weight:500;letter-spacing:3px;margin-top:4px}
.month-year::before,.month-year::after{content:'—';color:var(--gold);margin:0 8px;opacity:.6}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px;background:linear-gradient(180deg,rgba(250,246,236,.94),rgba(240,232,214,.9));border-radius:14px;padding:10px 0;border:1px solid rgba(201,169,97,.35);box-shadow:var(--shadow-soft)}
.weekday{text-align:center;font-size:10px;font-weight:500;color:var(--brown);letter-spacing:2px;padding:4px 0;text-transform:uppercase}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 5px;margin-top:10px}
.calendar-day{min-height:56px;border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:500;color:var(--dark);cursor:pointer;border:1px solid rgba(255,255,255,.5);transition:transform .2s;overflow:visible;box-shadow:0 2px 6px rgba(60,40,20,.12),inset 0 1px 0 rgba(255,255,255,.5)}
.calendar-day:active{transform:scale(.94)}
.calendar-day.empty{background:transparent;cursor:default;border:none;box-shadow:none}
.calendar-day.today{border-color:var(--gold);border-width:2px;box-shadow:0 0 0 2px rgba(201,169,97,.35),0 4px 14px rgba(201,169,97,.3)}
.calendar-day .day-number{position:absolute;top:4px;left:8px;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--dark)}
.calendar-day.emotional{background:linear-gradient(145deg,#B8D0DC,#9FBCC9);border-color:rgba(143,169,186,.6)}
.calendar-day.physical{background:linear-gradient(145deg,#D5C4DB,#B09CBC);border-color:rgba(176,156,188,.6)}
.calendar-day.lightDate{background:linear-gradient(145deg,#E8C4CB,#DDA0A8);border-color:rgba(221,160,168,.6)}
.calendar-day.bigDate{background:linear-gradient(145deg,#E0A0A8,#C97A7A);border-color:rgba(201,122,122,.6)}
.calendar-day.free{background:linear-gradient(145deg,#F2E8D5,#E5D5B8);border:1px dashed rgba(140,120,90,.5)}
.calendar-day.done-emotional{background:linear-gradient(145deg,#8FA9BA,#7A96A8);border-color:#6E8598;color:#F5EBD5}
.calendar-day.done-physical{background:linear-gradient(145deg,#B09CBC,#9A82A8);border-color:#8E7599;color:#F5EBD5}
.calendar-day.done-lightDate{background:linear-gradient(145deg,#DDA0A8,#C9848C);border-color:#BB737A;color:#F5EBD5}
.calendar-day.done-bigDate{background:linear-gradient(145deg,#C97A7A,#A85A5A);border-color:#955050;color:#F5EBD5}
.calendar-day.done-custom{background:linear-gradient(145deg,#B5C4A8,#96A88A);border-color:#84977A;color:#F5EBD5}
.calendar-day.done-emotional .day-number,.calendar-day.done-physical .day-number,.calendar-day.done-lightDate .day-number,.calendar-day.done-bigDate .day-number,.calendar-day.done-custom .day-number{color:#F5EBD5;opacity:1}
.calendar-day.next-month{background:transparent;border:none;cursor:default;box-shadow:none}
.calendar-day.next-month .day-number{color:rgba(245,235,213,.35);font-size:16px}
.calendar-day.today::before{content:'';position:absolute;inset:-3px;border-radius:16px;border:2px solid rgba(201,169,97,.7);pointer-events:none;animation:todayGlow 2.8s ease-in-out infinite}
@keyframes todayGlow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.05);opacity:.3;box-shadow:0 0 20px 4px rgba(201,169,97,.4)}}
.calendar-day.done-emotional::after,.calendar-day.done-physical::after,.calendar-day.done-lightDate::after,.calendar-day.done-bigDate::after,.calendar-day.done-custom::after{content:"❤";position:absolute;right:4px;bottom:2px;font-size:15px;line-height:1;color:#C97A7A;text-shadow:0 1px 2px rgba(255,255,255,.9),0 0 2px rgba(0,0,0,.15);z-index:4;animation:markerPop .5s cubic-bezier(.34,1.7,.64,1);pointer-events:none}
@keyframes markerPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:1}}
.calendar-day.planned-day::after{content:"⏳";position:absolute;right:4px;bottom:2px;font-size:15px;line-height:1;z-index:4;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));pointer-events:none}
.calendar-day.forced-day::before{content:'🎯';position:absolute;left:4px;bottom:2px;font-size:12px;z-index:3;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));pointer-events:none}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.legend-item{display:flex;align-items:center;gap:8px;color:var(--brown);font-size:10px;font-weight:500;background:linear-gradient(180deg,rgba(250,246,236,.94),rgba(240,232,214,.9));padding:10px 12px;border-radius:14px;border:1px solid rgba(201,169,97,.35);box-shadow:var(--shadow-soft);letter-spacing:.5px}
.legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.7) inset}
.legend-dot.emotional{background:linear-gradient(145deg,#B8D0DC,#9FBCC9)}
.legend-dot.physical{background:linear-gradient(145deg,#D5C4DB,#B09CBC)}
.legend-dot.lightDate{background:linear-gradient(145deg,#E8C4CB,#DDA0A8)}
.legend-dot.bigDate{background:linear-gradient(145deg,#E0A0A8,#C97A7A)}
.legend-dot.custom{background:linear-gradient(145deg,#B5C4A8,#96A88A)}
.manage-panel{margin-top:20px;padding:22px 20px;border-radius:20px;background:linear-gradient(180deg,rgba(250,246,236,.96),rgba(240,232,214,.94));box-shadow:var(--shadow);text-align:center;border:1px solid rgba(201,169,97,.35);position:relative;z-index:3}
.manage-panel-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-bottom:6px;color:var(--dark);letter-spacing:1px}
.manage-panel-text{color:var(--muted);font-size:11px;line-height:1.6;margin-bottom:16px;letter-spacing:.5px}
.btn-primary{width:100%;padding:15px;border-radius:40px;background:linear-gradient(145deg,#5A4A3A,#2E2419);color:#F5EBD5;font-size:12px;font-weight:500;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border:none;font-family:'Cormorant Garamond',serif;position:relative;z-index:3;box-shadow:0 6px 18px rgba(46,36,25,.35)}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{background:#C4B8A5;cursor:not-allowed;box-shadow:none}
.btn-secondary{width:100%;padding:13px;border-radius:40px;background:rgba(255,255,255,.4);color:var(--brown);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;border:1.5px solid rgba(90,74,58,.5);cursor:pointer;font-family:'Cormorant Garamond',serif;margin-top:10px;position:relative;z-index:3}
.btn-secondary:active{transform:scale(.97);background:rgba(90,74,58,.1)}
.btn-secondary:disabled{opacity:.4}
.btn-gold{width:100%;padding:15px;border-radius:40px;background:linear-gradient(145deg,#C9A961,#A8842E);color:#FCF8EE;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:none;font-family:'Cormorant Garamond',serif;position:relative;z-index:3;box-shadow:0 6px 20px rgba(168,132,46,.35)}
.btn-gold:active{transform:scale(.97)}
button,.btn-primary,.btn-secondary,.btn-gold,.role-btn,.spin-button,.nav-item,.month-arrow,.close-button,.flower-btn,.tab-btn,.settings-menu button,.add-row button,.del-btn{touch-action:manipulation;-webkit-appearance:none;-webkit-user-select:none;user-select:none;cursor:pointer}
.btn-secondary,.btn-primary,.btn-gold,.spin-button,.role-btn{min-height:52px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.month-arrow,.close-button{min-width:44px;min-height:44px}
.overlay{position:fixed;inset:0;background:rgba(30,22,16,.75);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.35s;z-index:100}
.overlay.active{opacity:1;visibility:visible}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 30px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#FAF6EC 0%,#F2EAD6 100%);border-radius:32px 32px 0 0;padding:30px 20px 40px;position:relative;transform:translateY(60px) scale(.96);opacity:0;transition:.45s cubic-bezier(.34,1.4,.64,1);box-shadow:0 -20px 60px rgba(0,0,0,.3);border:1px solid rgba(201,169,97,.4);border-bottom:none}
.overlay.active .modal{transform:translateY(0) scale(1);opacity:1}
.close-button{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;background:rgba(90,74,58,.08);color:var(--brown);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-family:inherit;z-index:10}
.close-button:active{transform:scale(.9) rotate(90deg)}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;text-align:center;letter-spacing:3px;text-transform:uppercase;color:var(--dark)}
.modal-subtitle{text-align:center;color:var(--muted);font-size:11px;margin-top:6px;letter-spacing:1.5px}
.overlay.center{align-items:center;padding:20px}
.overlay.center .modal{border-radius:28px;max-width:440px;transform:translateY(20px) scale(.92);border-bottom:1px solid rgba(201,169,97,.4)}
.overlay.center.active .modal{transform:translateY(0) scale(1)}
.daily-overlay{position:fixed;inset:0;background:rgba(30,22,16,.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1100;opacity:0;visibility:hidden;transition:.5s;cursor:pointer}
.daily-overlay.active{opacity:1;visibility:visible}
.daily-card{background:linear-gradient(160deg,#FAF6EC,#F0E6CE);border-radius:32px;padding:50px 30px 40px;max-width:400px;width:100%;text-align:center;position:relative;transform:scale(.85);transition:.6s cubic-bezier(.34,1.5,.64,1);border:1px solid rgba(201,169,97,.5);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.daily-overlay.active .daily-card{transform:scale(1)}
.daily-emoji{font-size:64px;display:inline-block;margin:20px 0;animation:dailyFloat 3.5s ease-in-out infinite}
@keyframes dailyFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.daily-message{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;line-height:1.45;color:var(--dark);margin-bottom:24px;font-style:italic;letter-spacing:.3px}
.daily-hint{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:.7;margin-top:20px;border-top:1px solid rgba(201,169,97,.35);padding-top:18px}
.role-buttons{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.role-btn{padding:18px 22px;border-radius:22px;border:1px solid rgba(201,169,97,.5);background:linear-gradient(180deg,#FAF6EC,#F2EAD6);font-family:inherit;color:var(--dark);cursor:pointer;font-size:14px;font-weight:500;letter-spacing:1px;display:flex;align-items:center;gap:14px;text-align:left}
.role-btn:active{transform:scale(.97)}
.role-btn .role-emoji{font-size:26px}
.role-btn.nastya{background:linear-gradient(145deg,#F5DDDE,#E8B8BD);border-color:#D4989E}
.role-btn.vanya{background:linear-gradient(145deg,#DCE6EE,#B8D0DC);border-color:#8FA9BA}
.role-badge{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(145deg,rgba(46,36,25,.95),rgba(30,22,16,.95));color:#F5EBD5;padding:6px 18px;border-radius:20px;font-size:10px;letter-spacing:2px;text-transform:uppercase;z-index:500;display:none;box-shadow:0 4px 16px rgba(0,0,0,.3);border:1px solid rgba(201,169,97,.4)}
.role-badge.show{display:block}
.settings-hotzone{position:fixed;bottom:0;right:0;width:150px;height:150px;z-index:900;background:transparent;touch-action:manipulation}
.settings-toggle{position:fixed;bottom:22px;right:22px;width:44px;height:44px;border-radius:50%;background:rgba(90,74,58,.4);color:#F5EBD5;font-size:18px;z-index:901;display:none;align-items:center;justify-content:center;cursor:pointer;border:none;opacity:0;transition:opacity .35s;backdrop-filter:blur(4px)}
.settings-toggle.visible{display:flex;opacity:1}
.settings-toggle:active{transform:scale(.9) rotate(45deg)}
.settings-menu{position:fixed;bottom:80px;right:22px;background:#FAF6EC;border-radius:20px;padding:10px 0;min-width:260px;z-index:902;display:none;border:1px solid rgba(201,169,97,.5);box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:70vh;overflow-y:auto}
.settings-menu.open{display:block}
.settings-menu button{display:block;width:100%;padding:14px 22px;background:none;border:0;text-align:left;font-size:12.5px;font-family:inherit;color:var(--dark)}
.settings-menu button:active{background:rgba(201,169,97,.15)}
.settings-menu .divider{height:1px;background:var(--line);margin:6px 16px}
.settings-menu .danger{color:#C97A7A}
.empty-menu-notice{padding:30px 22px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:1px;line-height:1.7;font-style:italic}
.empty-menu-notice .big{font-size:32px;display:block;margin-bottom:10px}
.empty-menu-notice .small{font-size:10px;opacity:.7;display:block;margin-top:8px}
.points-card{padding:30px 20px;border-radius:24px;background:linear-gradient(180deg,rgba(250,246,236,.96),rgba(240,232,214,.94));box-shadow:var(--shadow);text-align:center;border:1px solid rgba(201,169,97,.4);position:relative;overflow:hidden}
.points-number{font-family:'Cormorant Garamond',serif;font-size:64px;line-height:1;color:var(--gold-deep);font-weight:600}
.points-caption{color:var(--muted);font-size:10px;margin-top:6px;letter-spacing:3px;text-transform:uppercase}
.total-points{margin-top:8px;font-size:12px;color:var(--muted)}
.total-points span{color:var(--dark);font-weight:600}
.level-badge{margin-top:14px;display:inline-block;background:rgba(201,169,97,.15);padding:10px 22px;border-radius:40px;border:1px solid rgba(201,169,97,.5)}
.level-badge .emoji{font-size:22px;margin-right:8px}
.level-badge .name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--dark)}
.points-to-next{margin-top:12px;font-size:11px;color:var(--muted)}
.progress-track{height:6px;border-radius:20px;background:rgba(201,169,97,.2);margin-top:18px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#C9A961,#A8842E,#C9A961);background-size:200% 100%;border-radius:20px;transition:width .8s;animation:shimmer 2.5s linear infinite}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.notification-banner{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(250,246,236,.98),rgba(240,232,214,.98));backdrop-filter:blur(8px);border-bottom:1px solid rgba(201,169,97,.4);padding:14px 16px;display:none;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(60,40,20,.15)}
.notification-banner.show{display:flex}
.notification-banner .icon{font-size:24px;flex-shrink:0}
.notification-banner .content{flex:1}
.notification-banner .title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:var(--dark)}
.notification-banner .sub{font-size:11px;color:var(--muted);margin-top:2px}
.notification-banner .close-btn{background:none;border:none;font-size:18px;color:var(--muted);padding:4px 8px;cursor:pointer;font-family:inherit}
.notification-banner .action-link{background:linear-gradient(145deg,#5A4A3A,#2E2419);color:#F5EBD5;border:none;padding:8px 16px;border-radius:40px;font-size:10px;font-weight:600;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-family:'Cormorant Garamond',serif;white-space:nowrap}
.wheel-wrap{position:relative;width:min(90vw,360px);height:min(90vw,360px);margin:24px auto}
#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 30px rgba(60,40,20,.25))}

@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(1080deg);opacity:0}}
.activity-stat{padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid rgba(201,169,97,.3);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}

.app.reveal .header{animation:revealUp .8s .1s cubic-bezier(.34,1.4,.64,1) backwards}

@keyframes slideL{from{transform:translateX(30px);opacity:.4}to{transform:translateX(0);opacity:1}}

.love-tree-card{margin-top:22px;padding:22px 18px 20px;border-radius:24px;background:linear-gradient(180deg,rgba(250,246,236,.96),rgba(240,232,214,.94));border:1px solid rgba(201,169,97,.4);box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{--cream:#F5EFE0;--cream2:#FAF6EC;--dark:#2E2419;--brown:#5A4A3A;--muted:#8A7A66;--line:#D4C4A8;--gold:#C9A961;--gold-deep:#A8842E;--blue:#B8D0DC;--blue-deep:#8FA9BA;--purple:#D5C4DB;--purple-deep:#B09CBC;--rose:#E8B8BD;--rose-deep:#D4989E;--green:#B5C4A8;--red:#C97A7A;--shadow:0 8px 30px rgba(60,40,20,.18);--shadow-soft:0 3px 14px rgba(60,40,20,.12)}

.app{width:100%;max-width:520px;min-height:0;position:relative;padding-bottom:24px;z-index:2;margin:0 auto;background:transparent}
.header{text-align:center;padding:20px 16px 12px;position:relative;z-index:2}
.header-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:500;letter-spacing:4px;text-transform:uppercase;line-height:1.1;color:#F5EBD5;text-shadow:0 2px 12px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4)}
.header-title::after{content:'♡';display:block;font-size:16px;margin-top:14px;color:#F5EBD5;opacity:.85;line-height:1}
.header-names{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:500;letter-spacing:4px;text-transform:uppercase;margin-top:10px;display:inline-block;padding:10px 26px;border:1px solid rgba(255,255,255,.55);border-radius:2px;color:#F5EBD5;background:rgba(245,235,213,.08);backdrop-filter:blur(2px)}
.header-subtitle{margin-top:14px;font-size:10px;color:#EBDFC5;letter-spacing:3px;text-transform:uppercase;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.55);line-height:1.6}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,rgba(250,246,236,.96),rgba(240,232,214,.94));border:1px solid rgba(201,169,97,.35);border-radius:18px;margin:14px 4px 0;padding:6px 4px;position:relative;z-index:4;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
.nav-item{padding:12px 2px 10px;background:none;color:var(--brown);font-size:9px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;border-bottom:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:inherit;border:none;border-radius:12px;transition:all .2s;opacity:.7}
.nav-item .nav-icon{font-size:18px;transition:transform .3s;color:var(--brown)}
.nav-item.active{color:var(--dark);background:rgba(201,169,97,.12);opacity:1}
.nav-item.active .nav-icon{transform:scale(1.1);color:var(--gold-deep)}
.nav-item:active .nav-icon{transform:scale(.9)}
.page{display:none;padding:20px 8px;animation:fadeIn .45s cubic-bezier(.34,1.2,.64,1);position:relative;z-index:2}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;text-align:center;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;display:inline-block;width:100%;color:#F5EBD5;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.section-sub{color:#EBDFC5;font-weight:400;font-size:11px;letter-spacing:1.5px;background:rgba(245,235,213,.1);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:10px 18px;display:block;width:100%;box-sizing:border-box;margin:10px 0 18px;text-align:center;backdrop-filter:blur(2px);text-shadow:0 1px 4px rgba(0,0,0,.4)}
.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:linear-gradient(180deg,rgba(250,246,236,.96),rgba(240,232,214,.94));border-radius:20px;padding:14px 10px;border:1px solid rgba(201,169,97,.4);box-shadow:var(--shadow);position:relative;overflow:hidden}
.month-arrow{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.5);color:var(--brown);font-size:22px;border:1px solid rgba(201,169,97,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;position:relative;z-index:2;transition:background .2s}
.month-arrow:active{background:rgba(201,169,97,.25);transform:scale(.92)}
.month-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:32px;line-height:1;color:#2E2419;letter-spacing:1px}
.month-year{font-family:'Cormorant Garamond',serif;color:var(--brown);font-size:15px;font-weight:500;letter-spacing:3px;margin-top:4px}
.month-year::before,.month-year::after{content:'—';color:var(--gold);margin:0 8px;opacity:.6}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px;background:linear-gradient(180deg,rgba(250,246,236,.94),rgba(240,232,214,.9));border-radius:14px;padding:10px 0;border:1px solid rgba(201,169,97,.35);box-shadow:var(--shadow-soft)}
.weekday{text-align:center;font-size:10px;font-weight:500;color:var(--brown);letter-spacing:2px;padding:4px 0;text-transform:uppercase}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 5px;margin-top:10px}
.calendar-day{min-height:56px;border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:500;color:var(--dark);cursor:pointer;border:1px solid rgba(255,255,255,.5);transition:transform .2s;overflow:visible;box-shadow:0 2px 6px rgba(60,40,20,.12),inset 0 1px 0 rgba(255,255,255,.5)}
.calendar-day:active{transform:scale(.94)}
.calendar-day.empty{background:transparent;cursor:default;border:none;box-shadow:none}
.calendar-day.today{border-color:var(--gold);border-width:2px;box-shadow:0 0 0 2px rgba(201,169,97,.35),0 4px 14px rgba(201,169,97,.3)}
.calendar-day .day-number{position:absolute;top:4px;left:8px;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--dark)}
.calendar-day.emotional{background:linear-gradient(145deg,#B8D0DC,#9FBCC9);border-color:rgba(143,169,186,.6)}
.calendar-day.physical{background:linear-gradient(145deg,#D5C4DB,#B09CBC);border-color:rgba(176,156,188,.6)}
.calendar-day.lightDate{background:linear-gradient(145deg,#E8C4CB,#DDA0A8);border-color:rgba(221,160,168,.6)}
.calendar-day.bigDate{background:linear-gradient(145deg,#E0A0A8,#C97A7A);border-color:rgba(201,122,122,.6)}
.calendar-day.free{background:linear-gradient(145deg,#F2E8D5,#E5D5B8);border:1px dashed rgba(140,120,90,.5)}
.calendar-day.done-emotional{background:linear-gradient(145deg,#8FA9BA,#7A96A8);border-color:#6E8598;color:#F5EBD5}
.calendar-day.done-physical{background:linear-gradient(145deg,#B09CBC,#9A82A8);border-color:#8E7599;color:#F5EBD5}
.calendar-day.done-lightDate{background:linear-gradient(145deg,#DDA0A8,#C9848C);border-color:#BB737A;color:#F5EBD5}
.calendar-day.done-bigDate{background:linear-gradient(145deg,#C97A7A,#A85A5A);border-color:#955050;color:#F5EBD5}
.calendar-day.done-custom{background:linear-gradient(145deg,#B5C4A8,#96A88A);border-color:#84977A;color:#F5EBD5}
.calendar-day.done-emotional .day-number,.calendar-day.done-physical .day-number,.calendar-day.done-lightDate .day-number,.calendar-day.done-bigDate .day-number,.calendar-day.done-custom .day-number{color:#F5EBD5;opacity:1}
.calendar-day.next-month{background:transparent;border:none;cursor:default;box-shadow:none}
.calendar-day.next-month .day-number{color:rgba(245,235,213,.35);font-size:16px}
.calendar-day.today::before{content:'';position:absolute;inset:-3px;border-radius:16px;border:2px solid rgba(201,169,97,.7);pointer-events:none;animation:todayGlow 2.8s ease-in-out infinite}
@keyframes todayGlow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.05);opacity:.3;box-shadow:0 0 20px 4px rgba(201,169,97,.4)}}
.calendar-day.done-emotional::after,.calendar-day.done-physical::after,.calendar-day.done-lightDate::after,.calendar-day.done-bigDate::after,.calendar-day.done-custom::after{content:"❤";position:absolute;right:4px;bottom:2px;font-size:15px;line-height:1;color:#C97A7A;text-shadow:0 1px 2px rgba(255,255,255,.9),0 0 2px rgba(0,0,0,.15);z-index:4;animation:markerPop .5s cubic-bezier(.34,1.7,.64,1);pointer-events:none}
@keyframes markerPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:1}}
.calendar-day.planned-day::after{content:"⏳";position:absolute;right:4px;bottom:2px;font-size:15px;line-height:1;z-index:4;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));pointer-events:none}
.calendar-day.forced-day::before{content:'🎯';position:absolute;left:4px;bottom:2px;font-size:12px;z-index:3;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));pointer-events:none}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.legend-item{display:flex;align-items:center;gap:8px;color:var(--brown);font-size:10px;font-weight:500;background:linear-gradient(180deg,rgba(250,246,236,.94),rgba(240,232,214,.9));padding:10px 12px;border-radius:14px;border:1px solid rgba(201,169,97,.35);box-shadow:var(--shadow-soft);letter-spacing:.5px}
.legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.7) inset}
.legend-dot.emotional{background:linear-gradient(145deg,#B8D0DC,#9FBCC9)}
.legend-dot.physical{background:linear-gradient(145deg,#D5C4DB,#B09CBC)}
.legend-dot.lightDate{background:linear-gradient(145deg,#E8C4CB,#DDA0A8)}
.legend-dot.bigDate{background:linear-gradient(145deg,#E0A0A8,#C97A7A)}
.legend-dot.custom{background:linear-gradient(145deg,#B5C4A8,#96A88A)}
.manage-panel{margin-top:20px;padding:22px 20px;border-radius:20px;background:linear-gradient(180deg,rgba(250,246,236,.96),rgba(240,232,214,.94));box-shadow:var(--shadow);text-align:center;border:1px solid rgba(201,169,97,.35);position:relative;z-index:3}
.manage-panel-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-bottom:6px;color:var(--dark);letter-spacing:1px}
.manage-panel-text{color:var(--muted);font-size:11px;line-height:1.6;margin-bottom:16px;letter-spacing:.5px}
.btn-primary{width:100%;padding:15px;border-radius:40px;background:linear-gradient(145deg,#5A4A3A,#2E2419);color:#F5EBD5;font-size:12px;font-weight:500;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border:none;font-family:'Cormorant Garamond',serif;position:relative;z-index:3;box-shadow:0 6px 18px rgba(46,36,25,.35)}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{background:#C4B8A5;cursor:not-allowed;box-shadow:none}
.btn-secondary{width:100%;padding:13px;border-radius:40px;background:rgba(255,255,255,.4);color:var(--brown);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;border:1.5px solid rgba(90,74,58,.5);cursor:pointer;font-family:'Cormorant Garamond',serif;margin-top:10px;position:relative;z-index:3}
.btn-secondary:active{transform:scale(.97);background:rgba(90,74,58,.1)}
.btn-secondary:disabled{opacity:.4}
.btn-gold{width:100%;padding:15px;border-radius:40px;background:linear-gradient(145deg,#C9A961,#A8842E);color:#FCF8EE;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:none;font-family:'Cormorant Garamond',serif;position:relative;z-index:3;box-shadow:0 6px 20px rgba(168,132,46,.35)}
.btn-gold:active{transform:scale(.97)}
button,.btn-primary,.btn-secondary,.btn-gold,.role-btn,.spin-button,.nav-item,.month-arrow,.close-button,.flower-btn,.tab-btn,.settings-menu button,.add-row button,.del-btn{touch-action:manipulation;-webkit-appearance:none;-webkit-user-select:none;user-select:none;cursor:pointer}
.btn-secondary,.btn-primary,.btn-gold,.spin-button,.role-btn{min-height:52px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.month-arrow,.close-button{min-width:44px;min-height:44px}
.overlay{position:fixed;inset:0;background:rgba(30,22,16,.75);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.35s;z-index:100}
.overlay.active{opacity:1;visibility:visible}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 30px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#FAF6EC 0%,#F2EAD6 100%);border-radius:32px 32px 0 0;padding:30px 20px 40px;position:relative;transform:translateY(60px) scale(.96);opacity:0;transition:.45s cubic-bezier(.34,1.4,.64,1);box-shadow:0 -20px 60px rgba(0,0,0,.3);border:1px solid rgba(201,169,97,.4);border-bottom:none}
.overlay.active .modal{transform:translateY(0) scale(1);opacity:1}
.close-button{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;background:rgba(90,74,58,.08);color:var(--brown);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-family:inherit;z-index:10}
.close-button:active{transform:scale(.9) rotate(90deg)}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;text-align:center;letter-spacing:3px;text-transform:uppercase;color:var(--dark)}
.modal-subtitle{text-align:center;color:var(--muted);font-size:11px;margin-top:6px;letter-spacing:1.5px}
.overlay.center{align-items:center;padding:20px}
.overlay.center .modal{border-radius:28px;max-width:440px;transform:translateY(20px) scale(.92);border-bottom:1px solid rgba(201,169,97,.4)}
.overlay.center.active .modal{transform:translateY(0) scale(1)}
.daily-overlay{position:fixed;inset:0;background:rgba(30,22,16,.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1100;opacity:0;visibility:hidden;transition:.5s;cursor:pointer}
.daily-overlay.active{opacity:1;visibility:visible}
.daily-card{background:linear-gradient(160deg,#FAF6EC,#F0E6CE);border-radius:32px;padding:50px 30px 40px;max-width:400px;width:100%;text-align:center;position:relative;transform:scale(.85);transition:.6s cubic-bezier(.34,1.5,.64,1);border:1px solid rgba(201,169,97,.5);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.daily-overlay.active .daily-card{transform:scale(1)}
.daily-emoji{font-size:64px;display:inline-block;margin:20px 0;animation:dailyFloat 3.5s ease-in-out infinite}
@keyframes dailyFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.daily-message{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;line-height:1.45;color:var(--dark);margin-bottom:24px;font-style:italic;letter-spacing:.3px}
.daily-hint{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:.7;margin-top:20px;border-top:1px solid rgba(201,169,97,.35);padding-top:18px}
.role-buttons{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.role-btn{padding:18px 22px;border-radius:22px;border:1px solid rgba(201,169,97,.5);background:linear-gradient(180deg,#FAF6EC,#F2EAD6);font-family:inherit;color:var(--dark);cursor:pointer;font-size:14px;font-weight:500;letter-spacing:1px;display:flex;align-items:center;gap:14px;text-align:left}
.role-btn:active{transform:scale(.97)}
.role-btn .role-emoji{font-size:26px}
.role-btn.nastya{background:linear-gradient(145deg,#F5DDDE,#E8B8BD);border-color:#D4989E}
.role-btn.vanya{background:linear-gradient(145deg,#DCE6EE,#B8D0DC);border-color:#8FA9BA}
.role-badge{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(145deg,rgba(46,36,25,.95),rgba(30,22,16,.95));color:#F5EBD5;padding:6px 18px;border-radius:20px;font-size:10px;letter-spacing:2px;text-transform:uppercase;z-index:500;display:none;box-shadow:0 4px 16px rgba(0,0,0,.3);border:1px solid rgba(201,169,97,.4)}
.role-badge.show{display:block}
.settings-hotzone{position:fixed;bottom:0;right:0;width:150px;height:150px;z-index:900;background:transparent;touch-action:manipulation}
.settings-toggle{position:fixed;bottom:22px;right:22px;width:44px;height:44px;border-radius:50%;background:rgba(90,74,58,.4);color:#F5EBD5;font-size:18px;z-index:901;display:none;align-items:center;justify-content:center;cursor:pointer;border:none;opacity:0;transition:opacity .35s;backdrop-filter:blur(4px)}
.settings-toggle.visible{display:flex;opacity:1}
.settings-toggle:active{transform:scale(.9) rotate(45deg)}
.settings-menu{position:fixed;bottom:80px;right:22px;background:#FAF6EC;border-radius:20px;padding:10px 0;min-width:260px;z-index:902;display:none;border:1px solid rgba(201,169,97,.5);box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:70vh;overflow-y:auto}
.settings-menu.open{display:block}
.settings-menu button{display:block;width:100%;padding:14px 22px;background:none;border:0;text-align:left;font-size:12.5px;font-family:inherit;color:var(--dark)}
.settings-menu button:active{background:rgba(201,169,97,.15)}
.settings-menu .divider{height:1px;background:var(--line);margin:6px 16px}
.settings-menu .danger{color:#C97A7A}
.empty-menu-notice{padding:30px 22px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:1px;line-height:1.7;font-style:italic}
.empty-menu-notice .big{font-size:32px;display:block;margin-bottom:10px}
.empty-menu-notice .small{font-size:10px;opacity:.7;display:block;margin-top:8px}
.points-card{padding:30px 20px;border-radius:24px;background:linear-gradient(180deg,rgba(250,246,236,.96),rgba(240,232,214,.94));box-shadow:var(--shadow);text-align:center;border:1px solid rgba(201,169,97,.4);position:relative;overflow:hidden}
.points-number{font-family:'Cormorant Garamond',serif;font-size:64px;line-height:1;color:var(--gold-deep);font-weight:600}
.points-caption{color:var(--muted);font-size:10px;margin-top:6px;letter-spacing:3px;text-transform:uppercase}
.total-points{margin-top:8px;font-size:12px;color:var(--muted)}
.total-points span{color:var(--dark);font-weight:600}
.level-badge{margin-top:14px;display:inline-block;background:rgba(201,169,97,.15);padding:10px 22px;border-radius:40px;border:1px solid rgba(201,169,97,.5)}
.level-badge .emoji{font-size:22px;margin-right:8px}
.level-badge .name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--dark)}
.points-to-next{margin-top:12px;font-size:11px;color:var(--muted)}
.progress-track{height:6px;border-radius:20px;background:rgba(201,169,97,.2);margin-top:18px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#C9A961,#A8842E,#C9A961);background-size:200% 100%;border-radius:20px;transition:width .8s;animation:shimmer 2.5s linear infinite}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.notification-banner{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(250,246,236,.98),rgba(240,232,214,.98));backdrop-filter:blur(8px);border-bottom:1px solid rgba(201,169,97,.4);padding:14px 16px;display:none;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(60,40,20,.15)}
.notification-banner.show{display:flex}
.notification-banner .icon{font-size:24px;flex-shrink:0}
.notification-banner .content{flex:1}
.notification-banner .title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:var(--dark)}
.notification-banner .sub{font-size:11px;color:var(--muted);margin-top:2px}
.notification-banner .close-btn{background:none;border:none;font-size:18px;color:var(--muted);padding:4px 8px;cursor:pointer;font-family:inherit}
.notification-banner .action-link{background:linear-gradient(145deg,#5A4A3A,#2E2419);color:#F5EBD5;border:none;padding:8px 16px;border-radius:40px;font-size:10px;font-weight:600;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-family:'Cormorant Garamond',serif;white-space:nowrap}
.wheel-wrap{position:relative;width:min(90vw,360px);height:min(90vw,360px);margin:24px auto}
#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 30px rgba(60,40,20,.25))}
.wheel-pointer{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #5A4A3A;z-index:4}
.wheel-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFDF7,#F5E8DE 60%,#E8C88A);z-index:3;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid rgba(201,169,97,.6);box-shadow:0 4px 24px rgba(201,169,97,.4);color:#C97A7A}
.spin-button{display:block;margin:0 auto;min-width:240px;padding:16px 28px;border-radius:40px;background:linear-gradient(145deg,#5A4A3A,#2E2419);color:#F5EBD5;font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border:none;font-family:'Cormorant Garamond',serif;box-shadow:0 6px 24px rgba(46,36,25,.35)}
.spin-button:active{transform:scale(.96)}
.spin-button:disabled{background:#C4B8A5;cursor:not-allowed;box-shadow:none}
.result-box{margin-top:16px;padding:22px 18px;border-radius:22px;background:linear-gradient(145deg,rgba(245,221,224,.6),rgba(232,184,189,.4));text-align:center;border:1px solid rgba(201,169,97,.4)}
.result-box .result-text{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.4;margin-bottom:16px;font-weight:500;color:var(--dark)}
.input-line{width:100%;padding:14px 18px;border-radius:40px;border:1px solid rgba(201,169,97,.4);background:rgba(255,255,255,.7);font-family:inherit;font-size:13px;outline:none;margin-bottom:12px;color:var(--dark)}
.input-line:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,97,.2)}
.input-line::placeholder{color:var(--muted);font-size:11px}
.select-line{width:100%;padding:14px 18px;border-radius:40px;border:1px solid rgba(201,169,97,.4);background:rgba(255,255,255,.7);font-family:inherit;font-size:12px;margin-bottom:12px;cursor:pointer;color:var(--dark)}
.add-row{display:flex;gap:8px;margin-bottom:16px}
