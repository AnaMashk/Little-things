<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Проверка прогресса</title></head>
<body>
<script>
var s = 'ЧТО ЛЕЖИТ В ПАМЯТИ БРАУЗЕРА:\n\n';
s += 'Баллы за месяц: ' + (localStorage.getItem('monthPoints') || 'НЕТ') + '\n';
s += 'Баллы всего: ' + (localStorage.getItem('totalPoints') || 'НЕТ') + '\n';

var h = localStorage.getItem('history');
if (h) { try { s += 'Записей в истории: ' + JSON.parse(h).length + '\n'; } catch(e) { s += 'История битая\n'; } }
else s += 'История: НЕТ\n';

var cd = localStorage.getItem('completedDays');
if (cd) { try { s += 'Отмеченных дней: ' + Object.keys(JSON.parse(cd)).length + '\n'; } catch(e){} }
else s += 'Отмеченных дней: НЕТ\n';

var pd = localStorage.getItem('plannedDays');
if (pd) { try { s += 'Запланированных дней: ' + Object.keys(JSON.parse(pd)).length + '\n'; } catch(e){} }
else s += 'Планов: НЕТ\n';

var fd = localStorage.getItem('forcedDayTypes');
if (fd) { try { s += 'Ручных типов дней: ' + Object.keys(JSON.parse(fd)).length + '\n'; } catch(e){} }
else s += 'Ручных типов: НЕТ\n';

var pl = localStorage.getItem('pointsLog');
if (pl) { try { s += 'Записей в журнале баллов: ' + JSON.parse(pl).length + '\n'; } catch(e){} }
else s += 'Журнал: НЕТ\n';

var w = localStorage.getItem('wishes');
if (w) { try { s += 'Хотелок: ' + JSON.parse(w).length + '\n'; } catch(e){} }
else s += 'Хотелки: НЕТ\n';

var q = localStorage.getItem('quarantine');
if (q) { try { s += 'В карантине: ' + Object.keys(JSON.parse(q)).length + '\n'; } catch(e){} }

var a = localStorage.getItem('achievements');
if (a) { try { s += 'Достижений открыто: ' + JSON.parse(a).length + '\n'; } catch(e){} }
else s += 'Достижения: НЕТ\n';

alert(s);
</script>
</body></html>
